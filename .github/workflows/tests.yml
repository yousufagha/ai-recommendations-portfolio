name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r grid-pulse/requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Grid Pulse
        working-directory: grid-pulse
        run: python -m pytest -q
      - name: Dubai Golden Visa
        working-directory: dubai-property
        run: python -m pytest -q
